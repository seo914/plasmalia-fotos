<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Tus fotografías — Plasmalia</title>
<style>
  :root { --ciruela: #7C3A66; --tinta: #2B2530; --crema: #F7F4F1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Jost', Arial, sans-serif; background: var(--crema); color: var(--tinta); }
  .card { max-width: 380px; width: 100%; margin: 24px; padding: 40px 32px; text-align: center; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(43,37,48,.08); }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 1.9rem; margin: 0 0 8px; color: var(--ciruela); }
  p.sub { margin: 0 0 28px; opacity: .7; font-size: .95rem; }
  label { display: block; text-align: left; font-size: .85rem; font-weight: 600; margin: 0 0 6px; }
  input { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 18px; font-family: inherit; }
  button { width: 100%; background: var(--ciruela); color: #fff; border: none; padding: 13px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  button:hover { background: var(--tinta); }
  button:disabled { opacity: .6; cursor: default; }
  #error { color: #b00; font-size: .88rem; min-height: 1.2em; margin-top: -8px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="card">
  <h1>Tus fotografías</h1>
  <p class="sub">Escribe el nombre que te ha dado Plasmalia y la contraseña para ver y descargar tus fotos.</p>

  <form id="form">
    <label for="nombre">Nombre de los novios</label>
    <input id="nombre" type="text" placeholder="Ej: Ana y Luis" autocomplete="off" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="off" />

    <div id="error"></div>
    <button type="submit">Ver mis fotografías</button>
  </form>
</div>

<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nombre = document.getElementById('nombre').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('error');
  const btn = e.target.querySelector('button');
  err.textContent = '';

  if (!nombre || !password) {
    err.textContent = 'Rellena los dos campos.';
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch('/api/entrar', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ nombre, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'No encontramos tu galería.';
      btn.disabled = false;
      return;
    }
    location.href = `/boda/${data.slug}`;
  } catch (e2) {
    err.textContent = 'Algo ha ido mal, inténtalo de nuevo.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
